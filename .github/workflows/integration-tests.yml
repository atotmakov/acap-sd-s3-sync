name: Integration tests

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libglib2.0-dev libcurl4-openssl-dev libssl-dev gdb

      - name: Build host binary
        working-directory: app
        run: make host

      - name: Build host ASan binary
        working-directory: app
        run: make host-asan

      - name: Sanity check binaries were produced
        working-directory: app
        run: |
          test -x ./sds3sync-host
          test -x ./sds3sync-host-asan
          file ./sds3sync-host ./sds3sync-host-asan
          ldd ./sds3sync-host | grep -q axparameter && exit 1 || true

      - name: Install MinIO client (mc)
        run: |
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc

      - name: Start MinIO + toxiproxy
        working-directory: tests/integration
        run: docker compose up -d

      - name: Run happy-path scenario
        working-directory: tests/integration
        run: ./run_happy_path.sh

      - name: Run memory scenario
        working-directory: tests/integration
        run: ./run_memory.sh

      - name: Dump service logs on failure
        if: failure()
        working-directory: tests/integration
        run: docker compose logs

      - name: Tear down
        if: always()
        working-directory: tests/integration
        run: docker compose down -v

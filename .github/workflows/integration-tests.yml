name: Integration tests

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  host-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libglib2.0-dev libcurl4-openssl-dev libssl-dev

      - name: Build host binary
        working-directory: app
        run: make host

      - name: Build host ASan binary
        working-directory: app
        run: make host-asan

      - name: Sanity check binaries were produced
        working-directory: app
        run: |
          test -x ./sds3sync-host
          test -x ./sds3sync-host-asan
          file ./sds3sync-host ./sds3sync-host-asan
          ldd ./sds3sync-host | grep -q axparameter && exit 1 || true
